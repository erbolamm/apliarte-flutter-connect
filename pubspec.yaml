name: apliarte_flutter_connect
description: Flutter plugin foundation for local device-to-device connectivity, streaming, and native Android Wi-Fi Direct P2P.
version: 0.2.0
homepage: https://apliarte.com
repository: https://github.com/erbolamm/apliarte-flutter-connect
issue_tracker: https://github.com/erbolamm/apliarte-flutter-connect/issues
topics:
  - connectivity
  - streaming
  - mdns
  - p2p
  - wifi-direct

platforms:
  android:
  ios:

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.apliarte.apliarte_flutter_connect
        pluginClass: ApliarteFlutterConnectPlugin
      ios:
        pluginClass: ApliarteFlutterConnectPlugin
